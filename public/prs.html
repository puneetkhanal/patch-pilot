<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pull requests · PatchPilot</title><link rel="stylesheet" href="/app.css"></head><body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">P</span><span>PatchPilot</span></a><nav><a href="/">Issues</a><a class="active" href="/prs.html">Pull requests</a><a href="/worktrees.html">Worktrees</a></nav></header>
<main><section class="hero compact"><div><p class="eyebrow">Review queue</p><h1>Open pull requests and live checks.</h1><p>See CI and review state in one view, then send the selected queue to Slack through your configured MCP server.</p></div><div id="slack-status" class="status-pill">Checking Slack…</div></section>
<section class="control-panel"><label>Repository<input id="repo" placeholder="owner/repository"></label><button class="primary" id="refresh">Refresh PR status</button><label>Slack channel<input id="channel" placeholder="#security-reviews"></label><button id="send-slack">Send review request</button></section><div id="notice" class="notice hidden"></div><div class="table-wrap" style="margin-top:18px"><table><thead><tr><th></th><th>Pull request</th><th>Branch</th><th>Checks</th><th>Review</th><th>Updated</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script type="module">
import{$,api,h,installRepoControls,settings,splitRepo,withBusy}from'./common.js';let prs=[];const selected=new Set();const defaults=await api('/api/config/defaults');installRepoControls(defaults);const slack=await api('/api/slack/status');$('#slack-status').textContent=slack.configured?`Slack MCP ready · ${slack.tool}`:'Slack MCP not configured';function route(s=''){const[o,r]=splitRepo();return`/api/repos/${o}/${r}${s}`}function msg(t,e=false){const n=$('#notice');n.textContent=t;n.className=`notice${e?' error':''}`}async function load(){settings.repo=$('#repo').value;prs=await api(route('/pull-requests'));const openNumbers=new Set(prs.map(pr=>pr.number));for(const number of selected)if(!openNumbers.has(number))selected.delete(number);const rows=$('#rows');rows.replaceChildren(...prs.map(pr=>{const check=h('input',{type:'checkbox',checked:selected.has(pr.number),onchange:e=>e.target.checked?selected.add(pr.number):selected.delete(pr.number)});return h('tr',{},h('td',{},check),h('td',{},h('a',{href:pr.url,target:'_blank',rel:'noreferrer'},`#${pr.number} ${pr.title}`),h('div',{class:'manifest'},pr.author||'')),h('td',{class:'manifest'},pr.branch),h('td',{},h('span',{class:`status-dot ${pr.checks.conclusion}`}),`${pr.checks.conclusion} (${pr.checks.successful}/${pr.checks.total})`),h('td',{},pr.reviewState.replaceAll('_',' ')),h('td',{},new Date(pr.updatedAt).toLocaleString()),h('td',{},h('button',{class:'danger',onclick:e=>closePr(pr,e.currentTarget)},'Close PR')))}));if(!prs.length)rows.append(h('tr',{},h('td',{colspan:'7'},'No open pull requests.')))}async function closePr(pr,button){if(!confirm(`Close pull request #${pr.number} — ${pr.title}?`))return;try{await withBusy(button,'Closing…',async()=>{await api(route(`/pull-requests/${pr.number}/close`),{method:'POST',body:'{}'});selected.delete(pr.number);msg(`Pull request #${pr.number} closed.`);await load()})}catch(x){msg(x.message,true)}}$('#refresh').onclick=async e=>{const button=e.currentTarget;try{await withBusy(button,'Refreshing…',load)}catch(x){msg(x.message,true)}};$('#send-slack').onclick=async e=>{const button=e.currentTarget;try{await withBusy(button,'Sending…',async()=>{if(!selected.size)throw new Error('Select at least one pull request.');await api(route('/slack-review-request'),{method:'POST',body:JSON.stringify({channel:$('#channel').value||undefined,prNumbers:[...selected]})});msg('Review request sent through Slack MCP.')})}catch(x){msg(x.message,true)}};if(settings.repo)load().catch(e=>msg(e.message,true));
</script></body></html>
