<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worktrees · PatchPilot</title><link rel="stylesheet" href="/app.css"></head><body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">P</span><span>PatchPilot</span></a><nav><a href="/">Issues</a><a href="/prs.html">Pull requests</a><a class="active" href="/worktrees.html">Worktrees</a></nav></header>
<main><section class="hero compact"><div><p class="eyebrow">Local isolation</p><h1>Managed remediation worktrees.</h1><p>Inspect branches created for dependency fixes and safely remove finished worktrees from the selected clone.</p></div></section><section class="control-panel"><label>Repository<input id="repo" placeholder="owner/repository"></label><label class="grow">Local clone path<input id="project-path" placeholder="/path/to/local/clone"></label><button class="primary" id="load">List worktrees</button></section><div id="notice" class="notice hidden"></div><div class="table-wrap" style="margin-top:18px"><table><thead><tr><th>Branch</th><th>Path</th><th>Head</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main>
<script type="module">
import{$,api,h,installRepoControls,settings,splitRepo,withBusy}from'./common.js';const defaults=await api('/api/config/defaults');installRepoControls(defaults);function route(){const[o,r]=splitRepo();return`/api/repos/${o}/${r}/worktrees`}function msg(t,e=false){const n=$('#notice');n.textContent=t;n.className=`notice${e?' error':''}`}async function load(){settings.repo=$('#repo').value;settings.projectPath=$('#project-path').value;const xs=await api(`${route()}?projectPath=${encodeURIComponent(settings.projectPath)}`);const rows=$('#rows');rows.replaceChildren(...xs.map(x=>h('tr',{},h('td',{},x.branch||'detached'),h('td',{class:'manifest',title:x.path},x.path),h('td',{class:'manifest'},x.head?.slice(0,10)||''),h('td',{},h('button',{class:'danger',onclick:()=>remove(x)},'Remove')))));if(!xs.length)rows.append(h('tr',{},h('td',{colspan:'4'},'No managed remediation worktrees found.')))}async function remove(x){if(!confirm(`Remove worktree ${x.branch||x.path}?`))return;try{await api(`${route()}/${x.id}`,{method:'DELETE',body:JSON.stringify({projectPath:settings.projectPath})});msg('Worktree removed.');await load()}catch(e){msg(e.message,true)}}$('#load').onclick=async e=>{const button=e.currentTarget;try{await withBusy(button,'Loading…',load)}catch(x){msg(x.message,true)}};if(settings.repo&&settings.projectPath)load().catch(()=>{});
</script></body></html>
