<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Package update · PatchPilot</title><link rel="stylesheet" href="/app.css"></head><body>
<header class="topbar"><a class="brand" href="/"><span class="brand-mark">P</span><span>PatchPilot</span></a><nav><a href="/">Issues</a><a href="/prs.html">Pull requests</a><a href="/worktrees.html">Worktrees</a></nav></header>
<main><section class="hero compact"><div><p class="eyebrow">Ad-hoc remediation</p><h1>Update a vulnerable package.</h1><p>Create an isolated fix even when no imported alert exists. The current remediation adapter supports JavaScript/npm manifests.</p></div></section><div class="page-grid"><section class="panel form-stack"><label>Repository<input id="repo" placeholder="owner/repository"></label><label>Local clone path<input id="project-path" placeholder="/path/to/local/clone"></label><label>Manifest path<input id="manifest" value="package.json"></label><button id="load">Load dependencies</button><label>Package<select id="package"><option value="">Load a manifest first</option></select></label><label>Target version<input id="target" placeholder="1.2.3"></label><label><span><input id="create-pr" type="checkbox"> Push and create pull request</span></label><button class="primary" id="run">Run package update</button></section><section class="panel"><h2>Job output</h2><pre id="output" style="min-height:360px;background:#111914;color:#d9e9de;padding:16px;border-radius:10px;white-space:pre-wrap">No job running.</pre></section></div></main>
<script type="module">
import{$,api,h,installRepoControls,settings,splitRepo,withBusy}from'./common.js';const defaults=await api('/api/config/defaults');installRepoControls(defaults);function base(){const[o,r]=splitRepo();return`/api/repos/${o}/${r}`}$('#load').onclick=async e=>{const button=e.currentTarget;try{await withBusy(button,'Loading…',async()=>{settings.repo=$('#repo').value;settings.projectPath=$('#project-path').value;const data=await api(`/api/package-manifest?projectPath=${encodeURIComponent(settings.projectPath)}&manifestPath=${encodeURIComponent($('#manifest').value)}`);const deps={...data.dependencies,...data.devDependencies,...data.optionalDependencies,...data.peerDependencies};$('#package').replaceChildren(...Object.entries(deps).sort().map(([name,version])=>h('option',{value:name},`${name} · ${version}`)))})}catch(x){alert(x.message)}};$('#run').onclick=async e=>{const button=e.currentTarget;try{await withBusy(button,'Starting…',async()=>{const job=await api(`${base()}/package-updates`,{method:'POST',body:JSON.stringify({projectPath:settings.projectPath,manifestPath:$('#manifest').value,packageName:$('#package').value,targetVersion:$('#target').value,createPr:$('#create-pr').checked})});let current=job;while(!['succeeded','failed'].includes(current.status)){await new Promise(r=>setTimeout(r,2000));current=await api(`/api/package-update-jobs/${job.id}`);$('#output').textContent=current.log||current.status}$('#output').textContent=`${current.log}\n\nJob ${current.status}${current.error?`: ${current.error}`:''}`})}catch(x){$('#output').textContent=x.message}};
</script></body></html>
